name: Validate independent observatory template
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m scripts.check_reference
      - run: python3 -m unittest discover -s tests -t . -p 'test_*.py'
      - run: node --test tests/*.test.cjs
      - run: node --test infrastructure/cloudflare-runner/tests/*.test.mjs
